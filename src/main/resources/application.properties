# Active profiles
spring.profiles.active=local

spring.application.name=system-api

server.port=8081
spring.datasource.url=jdbc:mysql://localhost:3306/ceylon_adds_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.generate-ddl=true

spring.main.allow-bean-definition-overriding=true
spring.main.allow-circular-references=true

#jwt-config---------------
jwt.secret=${JWT_SECRET:placeholder_jwt_secret}
jwt.expiration=86400000
#jwt-config---------------

#twilio-config---------------
twilio.account-sid=${TWILIO_ACCOUNT_SID:placeholder_twilio_sid}
twilio.auth-token=${TWILIO_AUTH_TOKEN:placeholder_twilio_token}
twilio.whatsapp-number=${TWILIO_WHATSAPP_NUMBER:whatsapp:+14155238886}
#twilio-config---------------

#aws-config---------------
aws.accessKey=${AWS_ACCESS_KEY:placeholder_aws_key}
aws.secretKey=${AWS_SECRET_KEY:placeholder_aws_secret}
aws.bucketName=${AWS_BUCKET_NAME:ceylon-ad-bucket}
aws.region=${AWS_REGION:ap-south-1}
#aws-config---------------

#host-config---------------
system.host.accessMobile=+94000000000
#host-config---------------

spring.servlet.multipart.max-file-size=10GB
spring.servlet.multipart.max-request-size=10GB
spring.mvc.async.request-timeout=600000
logging.level.org.springframework.web.context.request.async=ERROR
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.connection-timeout=120000
server.tomcat.max-swallow-size=10485760

#cloudinary-config---------------
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:placeholder_cloudinary_name}
cloudinary.api-key=${CLOUDINARY_API_KEY:placeholder_cloudinary_key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:placeholder_cloudinary_secret}
cloudinary.folder=${CLOUDINARY_FOLDER:ceylon-ads}
#cloudinary-config---------------

# Storage selection: s3 or cloudinary
storage.provider=cloudinary